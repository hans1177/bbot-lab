name: Research engineering checks
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: research-engineering-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-research-test.txt
      - run: python -W ignore::FutureWarning -m unittest discover -s tests -v
      - name: Existing controller preparation check
        env:
          BBOT_LOCAL_ROOT: ${{ github.workspace }}
        run: |
          python strategy_lab/research_controller.py --mode managed-dry-run --skip-server-health > /tmp/preflight.json
          python -c "import json; r=json.load(open('/tmp/preflight.json')); assert r['ok'] and r['mutated'] is False and r['orders_touched'] is False; print('CONTROLLER_PREFLIGHT_OK')"
      - name: Checkout pinned server validation sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 57a210581fd0eda9f67dc0f20b54b9dc09030dc6
          path: release-context
          persist-credentials: false
      - name: Checkout canonical release scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 985c7dd5bc093e415208dddd707657be573ed602
          path: release-checks
          persist-credentials: false
      - name: Run all six canonical release verifiers in isolation
        shell: python
        run: |
          import hashlib,json,os,shutil,subprocess,sys
          from pathlib import Path
          repo=Path(os.environ['GITHUB_WORKSPACE']);context=repo/'release-context';checks=repo/'release-checks'
          root=Path(os.environ['RUNNER_TEMP'])/'release-validation'
          shutil.copytree(repo/'strategy_lab',root/'strategy_lab',ignore=shutil.ignore_patterns('results','__pycache__','*.pyc'))
          env=os.environ.copy();env.update(BBOT_LOCAL_ROOT=str(root),BOT_BASE_DIR=str(root),RUNNER_DRY_RUN='1')
          subprocess.run([sys.executable,'-B',str(root/'strategy_lab/v3_auto_runtime_release.py'),'--prepare-context'],cwd=root,env=env,check=True,timeout=60)
          subprocess.run([sys.executable,'-B',str(root/'strategy_lab/v3_auto_runtime_release.py'),'--verify-context'],cwd=root,env=env,check=True,timeout=600)
