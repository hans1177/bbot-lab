name: Read-only research state audit
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/research-state-audit.yml
      - strategy_lab/research_state_audit.py
      - tests/test_research_state_audit.py
permissions:
  contents: read
jobs:
  snapshot-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Test read-only checkpoint audit
        run: python -m unittest discover -s tests -p test_research_state_audit.py -v
      - name: Inspect verified public checkpoint without changing state
        env:
          GH_TOKEN: ${{ github.token }}
        run: python strategy_lab/research_state_audit.py --repo "$GITHUB_REPOSITORY"
