name: Research runtime
on:
  push:
    branches: [main]
    paths: ['.github/workflows/research-run.yml']
  workflow_dispatch:
    inputs:
      cycles:
        description: Maximum complete research cycles
        type: choice
        options: ['1', '4', '8']
        default: '1'
  schedule:
    - cron: '15 * * * *'
permissions:
  contents: write
  actions: write
concurrency:
  group: research-runtime-single-worker
  cancel-in-progress: false
jobs:
  research:
    if: github.event_name != 'schedule' || github.event.repository.private == true
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      BBOT_LOCAL_ROOT: ${{ github.workspace }}/runtime
      BBOT_AUTO_RESEARCH_MANAGER_V1: '1'
      B_BOT_V3_SERVER_PUSH_HOLD: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Require private research storage
        env:
          IS_PRIVATE: ${{ github.event.repository.private }}
        run: test "$IS_PRIVATE" = true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-research-test.txt
      - name: Checkout fixed private input revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 1153b49dc173eedf45bef023b06b2e873b2985ef
          path: research-inputs
          persist-credentials: false
      - name: Assemble verified research inputs
        shell: python
        run: |
          import hashlib,json,os
          from pathlib import Path
          source=Path(os.environ['GITHUB_WORKSPACE'])/'research-inputs'
          out=Path(os.environ['RUNNER_TEMP'])/'research-inputs';out.mkdir()
          manifest=json.loads((source/'INPUT.json').read_text())
          if manifest.get('schema')!='B_BOT_FIXED_RESEARCH_INPUT_PARTS_V1':raise RuntimeError('INPUT_PARTS_SCHEMA')
          with (out/'start.zip').open('wb') as target:
              for index,row in enumerate(manifest['parts']):
                  expected='start.zip.'+str(index).zfill(3)
                  if row['name']!=expected:raise RuntimeError('INPUT_PART_ORDER')
                  raw=(source/('chunks'+str(index//30).zfill(2))/expected).read_bytes()
                  if len(raw)!=row['bytes'] or hashlib.sha256(raw).hexdigest()!=row['sha256']:raise RuntimeError('INPUT_PART_HASH')
                  target.write(raw)
          archive=out/'start.zip'
          if archive.stat().st_size!=manifest['archive_bytes'] or hashlib.sha256(archive.read_bytes()).hexdigest()!=manifest['archive_sha256']:raise RuntimeError('INPUT_ARCHIVE_HASH')
          print('FIXED_PRIVATE_INPUT_REASSEMBLED_AND_VERIFIED')
      - name: Verify and prepare research workspace
        id: prepare
        shell: python
        run: |
          import hashlib,json,os,re,shutil,zipfile
          from pathlib import Path
          root=Path(os.environ['BBOT_LOCAL_ROOT']); root.mkdir()
          repo=Path(os.environ['GITHUB_WORKSPACE'])
          inputs=Path(os.environ['RUNNER_TEMP'])/'research-inputs'
          digest=hashlib.sha256((inputs/'start.zip').read_bytes()).hexdigest()
          if digest!='ace276261e768dbcb520ebd61208d0425af4e9371028a36449100bfd00971e56':
              raise RuntimeError('INITIAL_INPUT_ARCHIVE_HASH_MISMATCH')
          shutil.copytree(repo/'strategy_lab',root/'strategy_lab',ignore=shutil.ignore_patterns('results','__pycache__','*.pyc'))
          patterns=[rb'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----',rb'(?:AKIA|ASIA)[A-Z0-9]{16}',rb'gh[pousr]_[A-Za-z0-9]{30,}',rb'\d{9,12}:[A-Za-z0-9_-]{35}']
          seen=set()
          for archive_name,manifest_name,schema in [('start.zip','FRESH_INPUT.json','B_BOT_RESEARCH_FRESH_INPUT_V1')]:
              with zipfile.ZipFile(inputs/archive_name) as archive:
                  manifest=json.loads(archive.read(manifest_name))
                  if manifest.get('schema')!=schema or not isinstance(manifest.get('files'),dict):raise RuntimeError('INPUT_MANIFEST_INVALID')
                  if set(archive.namelist())!=set(manifest['files'])|{manifest_name}:raise RuntimeError('UNLISTED_INPUT_FILES')
                  for name,row in manifest['files'].items():
                      target=(root/name).resolve()
                      allowed=name in {'gate_lab_fast.py','gate_lab_exact_long_cache.parquet','ROADMAP_CONSTITUTION_V3.json','strategy_lab/lab_config.json'} or name.startswith(('data/candles/','backtest_data/')) and name.endswith('.parquet') or name.startswith('assist/') and name.endswith('.py')
                      if not allowed or not target.is_relative_to(root.resolve()) or name in seen:raise RuntimeError('INPUT_PATH_FORBIDDEN')
                      if archive.getinfo(name).file_size>512*1024**2:raise RuntimeError('INPUT_FILE_TOO_LARGE')
                      raw=archive.read(name)
                      if len(raw)!=row['bytes'] or hashlib.sha256(raw).hexdigest()!=row['sha256']:raise RuntimeError('INPUT_FILE_HASH_MISMATCH:'+name)
                      if name.endswith(('.py','.json')) and any(re.search(pattern,raw) for pattern in patterns):raise RuntimeError('INPUT_CREDENTIAL_PATTERN:'+name)
                      target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(raw);seen.add(name)
          if (root/'ROADMAP_CONSTITUTION_V3.json').read_bytes()!=(repo/'ROADMAP_CONSTITUTION_V3.json').read_bytes():raise RuntimeError('RESEARCH_CONSTITUTION_MISMATCH')
          config_path=root/'strategy_lab/lab_config.json'
          config=json.loads(config_path.read_text(encoding='utf-8-sig'))
          config['research_candidate_fill_timeframes']=['1H','6H','12H','1D','1W']
          config_path.write_text(json.dumps(config,indent=2))
          print('STARTUP_FRAMES=1H,6H,12H,1D,1W; 30M_DEFERRED_QUALIFIED_HISTORY_REQUIRED')
          receipt={name:hashlib.sha256((inputs/name).read_bytes()).hexdigest() for name in ('start.zip',)}
          receipt['research_scope']=config['research_candidate_fill_timeframes']
          (root/'INPUT_RECEIPT.json').write_text(json.dumps(receipt))
          print('INPUT_HASHES_AND_RESEARCH_CONSTITUTION_OK')
      - name: Download checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64,hashlib,json,os,urllib.request,urllib.error
          from pathlib import Path
          api='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']
          def get(path):
              req=urllib.request.Request(api+path,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=60) as response:return json.load(response)
          try:head=get('/git/ref/heads/research-state')['object']['sha']
          except urllib.error.HTTPError as error:
              if error.code!=404:raise
              if get('/actions/workflows/research-run.yml/runs?status=success&per_page=1').get('total_count',0):raise RuntimeError('PREVIOUS_CHECKPOINT_MISSING_NO_SILENT_RESET')
              print('FIRST_RUN_FRESH_RESEARCH')
          else:
              commit=get('/git/commits/'+head)
              tree=get('/git/trees/'+commit['tree']['sha'])['tree']
              entries={row['path']:row for row in tree}
              if set(entries)!={'CHECKPOINT.json','checkpoint.zip'}:raise RuntimeError('STATE_TREE_INVALID')
              folder=Path(os.environ['RUNNER_TEMP'])/'research-checkpoint-in';folder.mkdir()
              for name,row in entries.items():
                  if row['type']!='blob':raise RuntimeError('STATE_TYPE_INVALID')
                  blob=get('/git/blobs/'+row['sha'])
                  raw=base64.b64decode(blob['content'],validate=False)
                  if len(raw)!=blob['size']:raise RuntimeError('STATE_BLOB_SIZE')
                  (folder/name).write_bytes(raw)
              print('PRIVATE_GIT_CHECKPOINT_DOWNLOADED',head)
      - name: Restore exact research state
        id: restore
        shell: python
        run: |
          import hashlib,json,os,zipfile
          from pathlib import Path
          root=Path(os.environ['BBOT_LOCAL_ROOT']);folder=Path(os.environ['RUNNER_TEMP'])/'research-checkpoint-in'
          if folder.exists():
              receipt=json.loads((folder/'CHECKPOINT.json').read_text())
              raw=(folder/'checkpoint.zip').read_bytes()
              if receipt['schema']!='B_BOT_RESEARCH_CHECKPOINT_V1' or hashlib.sha256(raw).hexdigest()!=receipt['archive_sha256']:raise RuntimeError('CHECKPOINT_HASH_MISMATCH')
              if receipt['constitution_sha256']!=hashlib.sha256((root/'ROADMAP_CONSTITUTION_V3.json').read_bytes()).hexdigest():raise RuntimeError('CHECKPOINT_CONSTITUTION_MISMATCH')
              if receipt['engine_sha256']!=hashlib.sha256((root/'strategy_lab/run_strategy.py').read_bytes()).hexdigest():raise RuntimeError('CHECKPOINT_ENGINE_MISMATCH')
              if receipt['input_archives']!=json.loads((root/'INPUT_RECEIPT.json').read_text()):raise RuntimeError('CHECKPOINT_INPUTS_CHANGED')
              with zipfile.ZipFile(folder/'checkpoint.zip') as archive:
                  if set(archive.namelist())!=set(receipt['files']):raise RuntimeError('CHECKPOINT_FILE_SET_MISMATCH')
                  for name,row in receipt['files'].items():
                      target=(root/name).resolve()
                      if not name.startswith('strategy_lab/results/') or not target.is_relative_to(root.resolve()):raise RuntimeError('CHECKPOINT_PATH_FORBIDDEN')
                      if archive.getinfo(name).file_size>512*1024**2:raise RuntimeError('CHECKPOINT_FILE_TOO_LARGE')
                      data=archive.read(name)
                      if len(data)!=row['bytes'] or hashlib.sha256(data).hexdigest()!=row['sha256']:raise RuntimeError('CHECKPOINT_FILE_HASH_MISMATCH')
                      target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(data)
              print('CHECKPOINT_RESTORED',receipt['source_run_id'])
          else:
              print('FRESH_RESEARCH_NO_LOCAL_QUEUE_IMPORTED')
      - name: Existing controller preparation check
        run: |
          python "$BBOT_LOCAL_ROOT/strategy_lab/research_controller.py" --mode managed-dry-run --skip-server-health > "$RUNNER_TEMP/research-preflight.json"
          python -c "import json,os; from pathlib import Path; r=json.loads((Path(os.environ['RUNNER_TEMP'])/'research-preflight.json').read_text()); assert r['ok'] and r['orders_touched'] is False"
      - name: Run existing research controller
        id: research
        env:
          REQUESTED_CYCLES: ${{ inputs.cycles || (github.event_name == 'push' && '1') || '8' }}
        run: |
          set -o pipefail
          case "$REQUESTED_CYCLES" in 1|4|8) ;; *) exit 40 ;; esac
          python "$BBOT_LOCAL_ROOT/strategy_lab/research_controller.py" --mode loop --enable-research --max-cycles "$REQUESTED_CYCLES" --sleep-sec 1 | tee "$RUNNER_TEMP/research-cycles.jsonl"
          python - <<'PY'
          import json,os
          from pathlib import Path
          rows=[json.loads(line) for line in (Path(os.environ['RUNNER_TEMP'])/'research-cycles.jsonl').read_text().splitlines() if line.strip()]
          def reasons(value):
              if isinstance(value,dict):
                  for key,item in value.items():
                      if key=='reason':yield str(item)
                      yield from reasons(item)
              elif isinstance(value,list):
                  for item in value:yield from reasons(item)
          if not rows or any(row.get('action')!='AUTO_RESEARCH_MANAGER_STAGE10' for row in rows):raise RuntimeError('CANONICAL_RESEARCH_NOT_EXECUTED')
          if any(reason in {'RUN_STRATEGY_FAIL','RESULT_NOT_FOUND'} for row in rows for reason in reasons(row)):raise RuntimeError('RESEARCH_EXECUTION_FAILED_CHECK_PRIVATE_EVIDENCE')
          print('RESEARCH_EXECUTION_AND_RESULTS_RECORDED; STRATEGY_QUALIFICATION_IS_SEPARATE')
          PY
      - name: Preserve research checkpoint
        id: checkpoint
        if: always() && steps.prepare.outcome == 'success' && steps.restore.outcome == 'success'
        shell: python
        run: |
          import hashlib,json,os,zipfile
          from pathlib import Path
          root=Path(os.environ['BBOT_LOCAL_ROOT']);out=Path(os.environ['RUNNER_TEMP'])/'research-checkpoint-out';out.mkdir()
          state=root/'strategy_lab/results'
          files=[path for path in state.rglob('*') if path.is_file() and path.suffix.lower() in {'.json','.jsonl','.py','.csv','.parquet'} and '__pycache__' not in path.parts]
          if not files:raise RuntimeError('RESEARCH_STATE_NOT_CREATED')
          receipt={'schema':'B_BOT_RESEARCH_CHECKPOINT_V1','release_contract':'FINAL_GATES_THEN_EXISTING_RUNTIME_WORKER_V1','source_run_id':os.environ['GITHUB_RUN_ID'],'source_commit':os.environ['GITHUB_SHA'],'engine_sha256':hashlib.sha256((root/'strategy_lab/run_strategy.py').read_bytes()).hexdigest(),'input_archives':json.loads((root/'INPUT_RECEIPT.json').read_text()),'constitution_sha256':hashlib.sha256((root/'ROADMAP_CONSTITUTION_V3.json').read_bytes()).hexdigest(),'files':{}}
          with zipfile.ZipFile(out/'checkpoint.zip','w',zipfile.ZIP_DEFLATED,compresslevel=1) as archive:
              for path in sorted(files):
                  if path.is_symlink() or not path.resolve().is_relative_to(state.resolve()):raise RuntimeError('STATE_PATH_FORBIDDEN')
                  if path.stat().st_size>512*1024**2:raise RuntimeError('STATE_FILE_TOO_LARGE')
                  raw=path.read_bytes();name=path.relative_to(root).as_posix()
                  if path.suffix=='.json':json.loads(raw.decode('utf-8-sig'))
                  archive.writestr(name,raw);receipt['files'][name]={'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest()}
          receipt['archive_sha256']=hashlib.sha256((out/'checkpoint.zip').read_bytes()).hexdigest()
          (out/'CHECKPOINT.json').write_text(json.dumps(receipt,indent=2))
          print('RESEARCH_CHECKPOINT_SAVED',len(files))
      - name: Upload private checkpoint
        id: checkpoint_upload
        if: always() && steps.checkpoint.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64,json,os,urllib.request,urllib.error
          from pathlib import Path
          api='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']
          def request(path,data=None,method=None):
              body=None if data is None else json.dumps(data).encode()
              req=urllib.request.Request(api+path,data=body,method=method,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=90) as response:return json.load(response)
          try:parent=request('/git/ref/heads/research-state')['object']['sha']
          except urllib.error.HTTPError as error:
              if error.code!=404:raise
              parent=None
          out=Path(os.environ['RUNNER_TEMP'])/'research-checkpoint-out'
          elements=[]
          for name in ('CHECKPOINT.json','checkpoint.zip'):
              raw=(out/name).read_bytes()
              if len(raw)>90*1024**2:raise RuntimeError('CHECKPOINT_GIT_BLOB_LIMIT')
              blob=request('/git/blobs',{'content':base64.b64encode(raw).decode(),'encoding':'base64'})
              elements.append({'path':name,'mode':'100644','type':'blob','sha':blob['sha']})
          tree=request('/git/trees',{'tree':elements})
          commit=request('/git/commits',{'message':'Research checkpoint run '+os.environ['GITHUB_RUN_ID']+' attempt '+os.environ['GITHUB_RUN_ATTEMPT'],'tree':tree['sha'],'parents':[parent] if parent else []})
          if parent:request('/git/refs/heads/research-state',{'sha':commit['sha'],'force':False},'PATCH')
          else:request('/git/refs',{'ref':'refs/heads/research-state','sha':commit['sha']})
          if request('/git/ref/heads/research-state')['object']['sha']!=commit['sha']:raise RuntimeError('CHECKPOINT_REF_VERIFY')
          print('PRIVATE_GIT_CHECKPOINT_SAVED_AND_VERIFIED',commit['sha'])
